<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Précision Spatiale - Master</title>
    <!-- Tailwind CSS pour le style de l'interface -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Polices Google pour le style Cyberpunk/Néon -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #07090e;
            color: #f3f4f6;
            overflow: hidden; /* Empêche le défilement */
            touch-action: none; /* Désactive les gestes tactiles par défaut du navigateur */
            user-select: none;
        }
        
        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Grille néon en arrière-plan */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(31, 41, 55, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(31, 41, 55, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        /* Le canvas prend tout l'écran et se place sous l'UI */
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        /* Les calques d'interface sont au-dessus du canvas, mais laissent passer les clics (pointer-events: none) */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Réactiver les clics sur les éléments interactifs de l'UI */
        .interactive-ui {
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <!-- Le canvas principal du jeu -->
    <canvas id="game-canvas"></canvas>

    <!-- Couche d'interface utilisateur (HUD) -->
    <div id="ui-layer">
        
        <a href="https://jojosarcade.vercel.app/" class="interactive-ui absolute top-4 left-4 sm:top-5 sm:left-5 flex items-center space-x-2 bg-gray-900/80 backdrop-blur-md border border-gray-700/50 rounded-xl px-3 py-2 sm:px-4 sm:py-2.5 shadow-[0_0_15px_rgba(6,182,212,0.15)] hover:shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:border-cyan-500/50 transition-all duration-300 group z-50">
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-cyan-400 group-hover:-translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            <span class="orbitron text-[10px] sm:text-xs font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">ARCADE</span>
        </a>

        <!-- En-tête : Titre et Affichage du Score -->
        <header class="flex flex-col items-center w-full max-w-2xl mx-auto space-y-4 transition-all duration-500 mt-14 sm:mt-0" id="header-container">
            
            <!-- Barre de titre minimaliste -->
            <div class="interactive-ui bg-gray-900/80 backdrop-blur-md border border-gray-700/50 rounded-2xl px-6 py-3 shadow-xl shadow-cyan-900/20 flex items-center justify-between w-full">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-lg bg-cyan-500/20 flex items-center justify-center border border-cyan-500/50">
                        <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </div>
                    <h1 class="orbitron text-xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                        SPATIAL MASTER
                    </h1>
                </div>
                <div class="text-xs text-gray-400 uppercase tracking-widest orbitron" id="status-indicator">
                    En attente
                </div>
            </div>

            <!-- Panneau de Score (Visible uniquement lors du résultat) -->
            <div id="score-panel" class="opacity-0 translate-y-[-20px] transition-all duration-700 ease-out flex flex-col items-center bg-gray-950/90 backdrop-blur-lg border border-gray-700/80 rounded-3xl p-6 shadow-2xl w-full max-w-md">
                <div class="text-sm text-gray-400 uppercase tracking-widest mb-2 text-center">Précision Absolute (IoU)</div>
                <div class="orbitron text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-green-400 via-cyan-400 to-blue-500 drop-shadow-[0_0_15px_rgba(34,211,238,0.5)]" id="score-value">
                    0.00%
                </div>
                <div class="w-full h-2 bg-gray-800 rounded-full mt-4 overflow-hidden relative">
                    <div id="score-bar" class="h-full bg-gradient-to-r from-cyan-400 to-blue-500 w-0 transition-all duration-[2000ms] ease-out"></div>
                </div>
                <div class="mt-4 text-xs text-gray-500 text-center">
                    Le score calcule le chevauchement exact des pixels entre ta forme et la cible.
                </div>
            </div>
        </header>

        <!-- Bas de l'écran : Instructions et Boutons d'Action -->
        <footer class="flex flex-col items-center w-full mb-4 space-y-4">
            
            <!-- Instructions dynamiques -->
            <div id="instruction-panel" class="bg-gray-900/60 backdrop-blur-sm border border-gray-800/50 rounded-xl px-5 py-2 text-sm text-gray-300 shadow-lg text-center max-w-lg">
                Clique sur <strong class="text-white">COMMENCER</strong> pour voir la forme cible.
            </div>
            
            <!-- Aide aux contrôles (Mobile/Molette) -->
            <div id="controls-help" class="hidden opacity-0 transition-opacity duration-300 flex items-center space-x-4 bg-gray-900/80 border border-gray-700/50 rounded-lg px-4 py-2 text-xs">
                <div class="flex items-center space-x-1">
                    <svg class="w-4 h-4 text-magenta-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>
                    <span><strong>Glisser:</strong> Déplacer</span>
                </div>
                <div class="w-px h-4 bg-gray-700"></div>
                <div class="flex items-center space-x-1">
                    <svg class="w-4 h-4 text-magenta-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                    <span><strong>Molette:</strong> Taille</span>
                </div>
                <!-- Boutons +/- pour appareils sans molette (Tactile) -->
                <div class="interactive-ui flex items-center space-x-1 ml-2">
                    <button id="btn-minus" class="w-8 h-8 bg-gray-800 rounded hover:bg-gray-700 text-white font-bold">-</button>
                    <button id="btn-plus" class="w-8 h-8 bg-gray-800 rounded hover:bg-gray-700 text-white font-bold">+</button>
                </div>
            </div>

            <!-- Bouton d'action central -->
            <button id="action-btn" class="interactive-ui orbitron px-10 py-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-lg rounded-2xl shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all duration-200 transform hover:scale-105 active:scale-95">
                COMMENCER
            </button>
        </footer>
    </div>

    <script>
        // --- ÉLÉMENTS DOM ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const actionBtn = document.getElementById('action-btn');
        const statusIndicator = document.getElementById('status-indicator');
        const instructionPanel = document.getElementById('instruction-panel');
        const scorePanel = document.getElementById('score-panel');
        const scoreValue = document.getElementById('score-value');
        const scoreBar = document.getElementById('score-bar');
        const controlsHelp = document.getElementById('controls-help');
        const btnMinus = document.getElementById('btn-minus');
        const btnPlus = document.getElementById('btn-plus');

        // --- CONSTANTES ---
        const SHAPES = ['circle', 'square', 'triangle'];
        const COLOR_TARGET = '#06b6d4'; // Cyan
        const COLOR_PLAYER = '#d946ef'; // Magenta
        
        // --- ÉTAT DU JEU ---
        const state = {
            phase: 'IDLE', // IDLE, MEMORIZE, RECONSTRUCT, RESULT
            width: window.innerWidth,
            height: window.innerHeight,
            target: { type: 'circle', x: 0, y: 0, size: 100 },
            player: { type: 'circle', x: 0, y: 0, size: 100 },
            timeLeft: 0,
            timerId: null,
            drag: { isDragging: false, offsetX: 0, offsetY: 0 },
            score: 0
        };

        // Redimensionnement du canvas
        function resizeCanvas() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            canvas.width = state.width;
            canvas.height = state.height;
            drawFrame(); // Redessine immédiatement
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- STREAMING_CHUNK:Générateurs de Path2D pour des formes pleines précises ---
        
        // Retourne un objet Path2D centré sur (0,0). La translation se fera dans le rendu.
        function getShapePath(type, size) {
            const path = new Path2D();
            const radius = size / 2;

            if (type === 'circle') {
                path.arc(0, 0, radius, 0, Math.PI * 2);
            } 
            else if (type === 'square') {
                path.rect(-radius, -radius, size, size);
            } 
            else if (type === 'triangle') {
                // Triangle équilatéral pointant vers le haut
                const h = size * (Math.sqrt(3)/2);
                path.moveTo(0, -h/2);
                path.lineTo(radius, h/2);
                path.lineTo(-radius, h/2);
                path.closePath();
            }
            return path;
        }

        // --- STREAMING_CHUNK:Moteur de rendu du jeu ---
        function drawFrame() {
            // Effacer le canvas
            ctx.clearRect(0, 0, state.width, state.height);

            // Phase de Mémorisation : Afficher la cible uniquement
            if (state.phase === 'MEMORIZE') {
                ctx.save();
                ctx.translate(state.target.x, state.target.y);
                const path = getShapePath(state.target.type, state.target.size);
                
                // Ombre portée / Glow néon
                ctx.shadowColor = COLOR_TARGET;
                ctx.shadowBlur = 30;
                
                ctx.fillStyle = COLOR_TARGET;
                ctx.fill(path);
                ctx.restore();
            }

            // Phase de Reconstruction : Afficher la forme du joueur uniquement
            if (state.phase === 'RECONSTRUCT') {
                ctx.save();
                ctx.translate(state.player.x, state.player.y);
                const path = getShapePath(state.player.type, state.player.size);
                
                ctx.shadowColor = COLOR_PLAYER;
                ctx.shadowBlur = 20;
                
                ctx.fillStyle = COLOR_PLAYER;
                ctx.fill(path);
                
                // Bordure fine pour aider à la précision
                ctx.strokeStyle = '#fdf4ff';
                ctx.lineWidth = 1;
                ctx.stroke(path);
                ctx.restore();
            }

            // Phase de Résultat : Superposition
            if (state.phase === 'RESULT') {
                // 1. Dessiner la cible en semi-transparent
                ctx.save();
                ctx.translate(state.target.x, state.target.y);
                const targetPath = getShapePath(state.target.type, state.target.size);
                ctx.fillStyle = COLOR_TARGET;
                ctx.globalAlpha = 0.5; // Transparence pour voir le chevauchement
                ctx.fill(targetPath);
                
                // Bordure de la cible idéale
                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = COLOR_TARGET;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke(targetPath);
                ctx.restore();

                // 2. Dessiner la forme du joueur en semi-transparent
                ctx.save();
                ctx.translate(state.player.x, state.player.y);
                const playerPath = getShapePath(state.player.type, state.player.size);
                ctx.fillStyle = COLOR_PLAYER;
                ctx.globalAlpha = 0.5; // Mode mélange implicite par transparence
                
                // Utiliser lighter pour créer un mélange de couleur (Cyan + Magenta) dans l'intersection
                ctx.globalCompositeOperation = 'lighter'; 
                ctx.fill(playerPath);
                
                ctx.globalCompositeOperation = 'source-over'; // reset
                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = COLOR_PLAYER;
                ctx.lineWidth = 2;
                ctx.setLineDash([]);
                ctx.stroke(playerPath);
                ctx.restore();
            }
        }

        // --- STREAMING_CHUNK:Logique des Phases de Jeu ---

        function startMemorizePhase() {
            state.phase = 'MEMORIZE';
            
            // Génération de la cible aléatoire
            const padding = 150;
            state.target.type = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            state.target.size = Math.floor(Math.random() * 150) + 100; // 100px à 250px
            state.target.x = padding + Math.random() * (state.width - padding * 2);
            state.target.y = padding + Math.random() * (state.height - padding * 2);

            // Cacher le panneau de score si affiché
            scorePanel.classList.add('opacity-0', 'translate-y-[-20px]');
            scoreBar.style.width = '0%';
            controlsHelp.classList.add('hidden', 'opacity-0');

            // UI
            actionBtn.style.display = 'none';
            statusIndicator.innerHTML = '<span class="text-cyan-400">● Mémorisation</span>';
            state.timeLeft = 5;
            instructionPanel.innerHTML = `Mémorise la forme, la taille et la position exacte... <strong class="text-cyan-400 orbitron text-lg">${state.timeLeft}s</strong>`;

            drawFrame();

            // Timer de 5 secondes
            state.timerId = setInterval(() => {
                state.timeLeft--;
                if (state.timeLeft > 0) {
                    instructionPanel.innerHTML = `Mémorise la forme, la taille et la position exacte... <strong class="text-cyan-400 orbitron text-lg">${state.timeLeft}s</strong>`;
                } else {
                    clearInterval(state.timerId);
                    startReconstructPhase();
                }
            }, 1000);
        }

        function startReconstructPhase() {
            state.phase = 'RECONSTRUCT';
            
            // Initialisation de la forme joueur (Identique en type, mais taille/pos différentes)
            state.player.type = state.target.type;
            
            // Décaler volontairement la taille et la position de départ
            state.player.size = state.target.size + (Math.random() > 0.5 ? 80 : -80);
            state.player.size = Math.max(50, state.player.size); // Min size
            
            state.player.x = state.target.x + (Math.random() * 400 - 200);
            state.player.y = state.target.y + (Math.random() * 400 - 200);
            
            // Garder dans l'écran
            state.player.x = Math.max(50, Math.min(state.width - 50, state.player.x));
            state.player.y = Math.max(50, Math.min(state.height - 50, state.player.y));

            // UI
            statusIndicator.innerHTML = '<span class="text-magenta-400">● Reconstruction</span>';
            instructionPanel.innerHTML = `Replace la forme exactement où elle était, à la même taille.`;
            controlsHelp.classList.remove('hidden');
            setTimeout(() => controlsHelp.classList.remove('opacity-0'), 10);
            
            actionBtn.style.display = 'block';
            actionBtn.textContent = 'VALIDER MA PRÉCISION';
            actionBtn.className = "interactive-ui orbitron px-10 py-4 bg-gradient-to-r from-magenta-600 to-purple-600 hover:from-magenta-500 hover:to-purple-500 text-white font-bold text-lg rounded-2xl shadow-[0_0_20px_rgba(217,70,239,0.4)] transition-all duration-200 transform hover:scale-105 active:scale-95";

            drawFrame();
        }

        // --- STREAMING_CHUNK:Calcul Ultra-Précis IoU par pixels & Résultat ---

        function calculateExactIoU() {
            // Créer un canvas en mémoire (hors-écran)
            const offCanvas = document.createElement('canvas');
            offCanvas.width = state.width;
            offCanvas.height = state.height;
            const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
            
            // 1. Dessiner la Cible en pur ROUGE opaque (255, 0, 0)
            offCtx.save();
            offCtx.translate(state.target.x, state.target.y);
            const targetPath = getShapePath(state.target.type, state.target.size);
            offCtx.fillStyle = '#FF0000';
            offCtx.fill(targetPath);
            offCtx.restore();

            // Modifier le mode de composition pour ADDITIONNER les couleurs
            offCtx.globalCompositeOperation = 'lighter';

            // 2. Dessiner le Joueur en pur VERT opaque (0, 255, 0)
            offCtx.save();
            offCtx.translate(state.player.x, state.player.y);
            const playerPath = getShapePath(state.player.type, state.player.size);
            offCtx.fillStyle = '#00FF00';
            offCtx.fill(playerPath);
            offCtx.restore();

            // 3. Analyser les pixels
            const imgData = offCtx.getImageData(0, 0, state.width, state.height).data;
            let intersectionPixels = 0;
            let unionPixels = 0;

            // Parcours du tableau RGBA (sauts de 4)
            for (let i = 0; i < imgData.length; i += 4) {
                const r = imgData[i];     // Canal Rouge (Cible)
                const g = imgData[i + 1]; // Canal Vert (Joueur)

                if (r > 0 && g > 0) {
                    // Pixel présent sur la cible ET le joueur (Intersection)
                    intersectionPixels++;
                    unionPixels++;
                } else if (r > 0 || g > 0) {
                    // Pixel présent sur l'un OU l'autre (Union globale)
                    unionPixels++;
                }
            }

            // Calcul du pourcentage : Intersection / Union
            if (unionPixels === 0) return 0;
            const precision = (intersectionPixels / unionPixels) * 100;
            return Math.max(0, precision); // Assure un score >= 0
        }

        function animateScore(finalScore) {
            let start = 0;
            const duration = 2000; // 2 secondes
            const startTime = performance.now();

            function updateCounter(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Easing function (easeOutExpo)
                const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                
                const currentScore = start + (finalScore - start) * easeProgress;
                
                scoreValue.textContent = currentScore.toFixed(2) + '%';
                scoreBar.style.width = currentScore + '%';

                // Change color based on score during animation
                if (currentScore < 50) {
                    scoreValue.className = "orbitron text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-red-500 to-orange-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]";
                    scoreBar.className = "h-full bg-gradient-to-r from-red-500 to-orange-500 w-0 transition-all duration-[2000ms] ease-out";
                } else if (currentScore < 85) {
                    scoreValue.className = "orbitron text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-yellow-400 to-amber-600 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)]";
                    scoreBar.className = "h-full bg-gradient-to-r from-yellow-400 to-amber-600 w-0 transition-all duration-[2000ms] ease-out";
                } else {
                    scoreValue.className = "orbitron text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-green-400 via-cyan-400 to-blue-500 drop-shadow-[0_0_15px_rgba(34,211,238,0.5)]";
                    scoreBar.className = "h-full bg-gradient-to-r from-cyan-400 to-blue-500 w-0 transition-all duration-[2000ms] ease-out";
                }

                if (progress < 1) {
                    requestAnimationFrame(updateCounter);
                }
            }
            requestAnimationFrame(updateCounter);
        }

        function validateAttempt() {
            state.phase = 'RESULT';
            controlsHelp.classList.add('opacity-0');
            setTimeout(() => controlsHelp.classList.add('hidden'), 300);
            
            // Calculer le score exact
            state.score = calculateExactIoU();

            // UI : Afficher les résultats
            statusIndicator.innerHTML = '<span class="text-white">● Résultat Final</span>';
            instructionPanel.innerHTML = `Voici la différence visuelle. Observe bien pour t'améliorer !`;
            
            actionBtn.textContent = 'ESSAI SUIVANT';
            actionBtn.className = "interactive-ui orbitron px-10 py-4 bg-gradient-to-r from-gray-700 to-gray-900 hover:from-gray-600 hover:to-gray-800 text-white font-bold text-lg rounded-2xl shadow-[0_0_15px_rgba(255,255,255,0.1)] border border-gray-600 transition-all duration-200 transform hover:scale-105 active:scale-95 mt-4";

            // Afficher le panneau de score
            scorePanel.classList.remove('opacity-0', 'translate-y-[-20px]');
            
            // Lancer l'animation du score
            animateScore(state.score);
            
            drawFrame();
        }

        // --- STREAMING_CHUNK:Gestion des Interactions (Souris & Tactile) ---

        // Fonction pour vérifier si le point (x,y) est à l'intérieur de la forme du joueur
        function isPointInPlayerShape(px, py) {
            ctx.save();
            ctx.translate(state.player.x, state.player.y);
            const path = getShapePath(state.player.type, state.player.size);
            // On utilise isPointInPath sur le context principal
            const isInPath = ctx.isPointInPath(path, px, py);
            ctx.restore();
            return isInPath;
        }

        function handlePointerDown(e) {
            if (state.phase !== 'RECONSTRUCT') return;
            
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const px = clientX - rect.left;
            const py = clientY - rect.top;

            if (isPointInPlayerShape(px, py)) {
                state.drag.isDragging = true;
                // Calculer l'offset pour ne pas que le centre "snap" à la souris
                state.drag.offsetX = px - state.player.x;
                state.drag.offsetY = py - state.player.y;
                canvas.style.cursor = 'grabbing';
            }
        }

        function handlePointerMove(e) {
            if (state.phase !== 'RECONSTRUCT') return;

            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const px = clientX - rect.left;
            const py = clientY - rect.top;

            // Curseur visuel
            if (!state.drag.isDragging) {
                canvas.style.cursor = isPointInPlayerShape(px, py) ? 'grab' : 'default';
            }

            // Déplacement effectif
            if (state.drag.isDragging) {
                state.player.x = px - state.drag.offsetX;
                state.player.y = py - state.drag.offsetY;
                
                // Garder approximativement dans l'écran
                state.player.x = Math.max(0, Math.min(state.width, state.player.x));
                state.player.y = Math.max(0, Math.min(state.height, state.player.y));
                
                drawFrame();
            }
        }

        function handlePointerUp() {
            if (state.drag.isDragging) {
                state.drag.isDragging = false;
                canvas.style.cursor = 'grab';
            }
        }

        // Molette pour redimensionner
        canvas.addEventListener('wheel', (e) => {
            if (state.phase !== 'RECONSTRUCT') return;
            e.preventDefault(); // Empêcher le scroll de page (bien que body overflow hidden)
            
            const speed = 5;
            const direction = Math.sign(e.deltaY);
            
            // Si direction > 0 (molette vers soi), rétrécir. Sinon, agrandir.
            state.player.size -= direction * speed;
            
            // Limites de taille
            state.player.size = Math.max(30, Math.min(state.width * 0.8, state.player.size));
            
            drawFrame();
        }, { passive: false });

        // Souris
        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        // Tactile
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { if(state.drag.isDragging) e.preventDefault(); handlePointerMove(e); }, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        // Boutons de taille tactiles
        function changeSize(delta) {
            if (state.phase !== 'RECONSTRUCT') return;
            state.player.size = Math.max(30, Math.min(state.width * 0.8, state.player.size + delta));
            drawFrame();
        }
        btnMinus.addEventListener('click', () => changeSize(-10));
        btnPlus.addEventListener('click', () => changeSize(10));


        // --- STREAMING_CHUNK:Lancement du jeu ---

        actionBtn.addEventListener('click', () => {
            if (state.phase === 'IDLE' || state.phase === 'RESULT') {
                startMemorizePhase();
            } else if (state.phase === 'RECONSTRUCT') {
                validateAttempt();
            }
        });

        // Dessin initial vide avec fond
        drawFrame();

    </script>
</body>
</html>
